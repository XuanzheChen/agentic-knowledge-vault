name: Fix Agent Context navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Context links
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('Agent/Agent.md'); s=p.read_text(encoding='utf-8'); s=s.replace('[[Agent/Context/context|Context]]', '[Context](Context/context.md)'); p.write_text(s, encoding='utf-8')"
          rm .github/workflows/fix-agent-context-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Agent Context subtree link"
          git push
