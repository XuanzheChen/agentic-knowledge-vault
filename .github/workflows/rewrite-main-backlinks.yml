name: Apply Tree navigation rules

on:
  push:
    branches:
      - reorganize-knowledge-forest

permissions:
  contents: write

jobs:
  update-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reorganize-knowledge-forest
          fetch-depth: 0

      - name: Update Tree navigation and AGENTS rules
        shell: python
        run: |
          from pathlib import Path

          nav = {
              "LLM/LLM.md": "[[main|返回知识主干]] · [[部署]] · [[对比问题]]",
              "LLM/预训练/预训练.md": "[[LLM|返回上级：LLM]] · [[main|返回知识主干]]",
              "LLM/预训练/RoPE/RoPE.md": "[[预训练|返回上级：预训练]] · [[main|返回知识主干]]",
              "LLM/中训练/中训练.md": "[[LLM|返回上级：LLM]] · [[main|返回知识主干]]",
              "LLM/后训练/后训练.md": "[[LLM|返回上级：LLM]] · [[main|返回知识主干]]",
              "LLM/后训练/微调/微调.md": "[[后训练|返回上级：后训练]] · [[main|返回知识主干]]",
              "LLM/注意力机制/注意力机制.md": "[[LLM|返回上级：LLM]] · [[main|返回知识主干]] · [[预训练]] · [[残差连接]]",
              "LLM/残差连接/残差连接.md": "[[LLM|返回上级：LLM]] · [[main|返回知识主干]] · [[预训练]] · [[注意力机制]]",
              "LLM/部署/部署.md": "[[LLM|返回上级：LLM]] · [[main|返回知识主干]]",
              "Agent/Agent.md": "[[main|返回知识主干]] · [[Agent框架]] · [[context|Context]] · [[Memory]]",
              "Agent/Agent框架/Agent框架.md": "[[Agent|返回上级：Agent]] · [[main|返回知识主干]] · [[context|Context 工程]]",
              "Agent/通信协议/通信协议.md": "[[Agent|返回上级：Agent]] · [[main|返回知识主干]] · [[Agent框架|Agent 框架]]",
              "Agent/Context/context.md": "[[Agent|返回上级：Agent]] · [[main|返回知识主干]] · [[Agent框架|Agent 框架]]",
              "Agent/Context/Memory/Memory.md": "[[context|返回上级：Context]] · [[main|返回知识主干]] · [[Agent|Agent 基础]] · [[RAG]]",
              "Agent/Context/RAG/RAG.md": "[[context|返回上级：Context]] · [[main|返回知识主干]] · [[Memory]]",
              "Agent/评估/评估.md": "[[Agent|返回上级：Agent]] · [[main|返回知识主干]]",
              "对比问题/对比问题.md": "[[main|返回知识主干]]",
          }

          children = {
              "LLM/LLM.md": [
                  ("预训练", "大规模通用数据上的基础能力、架构与训练机制"),
                  ("中训练", "继续训练中的定向能力强化"),
                  ("后训练", "SFT、偏好优化、强化学习、自训练与蒸馏等行为塑造"),
                  ("注意力机制", "Attention / Linear Attention 的核心机制与演进"),
                  ("残差连接", "深层模型中的 residual information flow 与连接结构"),
                  ("部署", "模型推理服务的资源、性能、可靠性与成本"),
              ],
              "LLM/预训练/预训练.md": [
                  ("RoPE", "旋转位置编码、长上下文扩展与频谱设计"),
              ],
              "LLM/后训练/后训练.md": [
                  ("微调", "微调相关概念及其在后训练体系中的归属"),
              ],
              "Agent/Agent.md": [
                  ("Agent框架", "Agent 开发框架的抽象层级、控制流与工程取舍"),
                  ("通信协议", "MCP、A2A、ANP 等 Agent 互操作协议"),
                  ("context|Context", "Context Engineering，以及 Memory、RAG 等工作集来源与治理"),
                  ("评估", "Agent 的任务结果、轨迹、可靠性、安全与效率评估"),
              ],
              "Agent/Context/context.md": [
                  ("Memory", "长期记忆的形成、检索、更新、聚合与遗忘"),
                  ("RAG", "外部知识的组织、索引、检索、重排与增强生成"),
              ],
          }

          def set_nav(path, desired):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              lines = text.splitlines()
              title = next(i for i, line in enumerate(lines) if line.startswith("# "))
              i = title + 1
              while i < len(lines) and not lines[i].strip():
                  i += 1
              if i < len(lines) and (lines[i].startswith("[[") or lines[i].startswith("所属主题：")):
                  lines[i] = desired
              else:
                  lines[i:i] = [desired, ""]
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def add_children(path, items):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if "## 子树" in text:
                  return
              marker = "## 问题目录"
              if marker not in text:
                  raise RuntimeError(f"Missing question directory marker: {path}")
              rows = ["## 子树", "", "| 子树 | 内容 |", "| --- | --- |"]
              for target, desc in items:
                  if "|" in target:
                      page, label = target.split("|", 1)
                      link = f"[[{page}|{label}]]"
                  else:
                      link = f"[[{target}]]"
                  rows.append(f"| {link} | {desc} |")
              block = "\n".join(rows) + "\n\n"
              text = text.replace(marker, block + marker, 1)
              p.write_text(text, encoding="utf-8")

          for path, desired in nav.items():
              set_nav(path, desired)
          for path, items in children.items():
              add_children(path, items)

          agents = Path("AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          anchor = "- 整个知识库按“知识森林 → Tree → 子树 → …… → Q&A 叶子”递归组织。根目录的 `main.md` 是唯一的知识主干入口；不要再创建或恢复以 `index.md` 为入口的旧结构。"
          nav_rule = "- 每个 Tree 的 Markdown 顶部都必须提供向上导航。一级 Tree 的直接上级就是 `main.md`，因此只保留一个“返回知识主干”链接；二级及更深 Tree 必须同时提供“返回上级 Tree”和“返回知识主干”两个入口。可以在其后保留少量有阅读价值的横向关联链接，但不能替代这两个向上入口。"
          child_rule = "- 只要一个 Tree 存在直接下一级子树，就必须在正文前部、Q&A 目录之前设置 `## 子树` 导航区，使用类似 `main.md` 的简洁表格列出所有直接子树及其内容说明；只列直接下一层，不在当前页展开孙级 Tree。没有下一级子树的叶端 Tree 不创建空的“子树”区。"
          if nav_rule not in text:
              text = text.replace(anchor, anchor + "\n" + nav_rule + "\n" + child_rule, 1)
          agents.write_text(text, encoding="utf-8")

          Path(".github/workflows/rewrite-main-backlinks.yml").unlink()

      - name: Commit navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add recursive Tree navigation"
          git push origin HEAD:reorganize-knowledge-forest
