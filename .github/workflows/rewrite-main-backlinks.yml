name: Refine pretraining tree

on:
  push:
    branches: [reorganize-knowledge-forest]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine tree and links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          ROOT = Path('.')
          pre_path = Path('LLM/预训练/预训练.md')
          att_old_path = Path('LLM/注意力机制/注意力机制.md')
          res_old_path = Path('LLM/残差连接/残差连接.md')
          rope_old_path = Path('LLM/预训练/RoPE/RoPE.md')

          pre_text = pre_path.read_text(encoding='utf-8')
          att_text = att_old_path.read_text(encoding='utf-8')
          res_text = res_old_path.read_text(encoding='utf-8')
          rope_text = rope_old_path.read_text(encoding='utf-8')

          def sections(text):
              ms = list(re.finditer(r'(?m)^## (.+?)\n', text))
              out = {}
              for i, m in enumerate(ms):
                  end = ms[i + 1].start() if i + 1 < len(ms) else len(text)
                  out[m.group(1).strip()] = text[m.start():end].rstrip()
              return out

          def clean_section(s):
              s = s.rstrip()
              s = re.sub(r'\n---\n\n相关主题：.*\Z', '', s, flags=re.S)
              return s.rstrip()

          pre_sec = {k: clean_section(v) for k, v in sections(pre_text).items()}
          att_sec = {k: clean_section(v) for k, v in sections(att_text).items()}
          res_sec = {k: clean_section(v) for k, v in sections(res_text).items()}
          rope_sec = {k: clean_section(v) for k, v in sections(rope_text).items()}

          data_heads = [
              '现代 LLM 预训练的数据是什么样的？',
              '预训练数据为什么要做安全过滤？',
              '预训练数据为什么要做分类？',
          ]
          objective_heads = [
              '主流的大模型预训练算法有什么？',
              '现代 LLM 预训练常见的辅助目标有哪些？',
              'MTP 怎么做？',
              'FIM 在训练时，将前缀和后缀作为上下文输入，会打上标注吗？实现的是什么样的能力？',
          ]
          activation_norm_heads = [
              'ReLU、GELU 与 SwiGLU 在数学上有什么区别？',
              '如何理解 Gated MLP？SwiGLU 与 GEGLU 是什么关系？',
              'LayerNorm 与 RMSNorm 有什么区别？为什么现代 LLM 大量采用 RMSNorm？',
              '为什么现代 LLM 普遍从 Post-Norm 转向 Pre-Norm？',
              'QK-Norm 是什么？它为什么能提高训练稳定性？',
          ]
          attention_moved_heads = [
              'MHA 的基本原理是什么？',
              'GQA 如何在 MHA 上降低 KV Cache？',
              'MLA 的基本原理是什么？',
              '为什么注意力结构会从 MHA 发展到 GQA，再到 MLA？',
              'MLA 中的低秩降维是怎么做的？降维之后又是怎么恢复的？',
              '为什么 MLA 里的 RoPE 要换成 Decoupled RoPE？',
          ]
          residual_moved_heads = [
              'Kimi K3 的残差结构与传统残差有什么不同？它起什么作用？',
          ]
          moe_heads = [
              'MoE 怎么做？',
              'Auxiliary-Loss-Free 的 Bias 是怎么帮助 specialization？',
          ]
          pre_keep_heads = [
              '什么是预训练？',
              '现代 LLM 预训练的模型架构是什么样的？',
              '现代 LLM 的预训练系统是什么样的？',
          ]
          att_existing_heads = ['KDA 是什么？']
          res_existing_heads = [
              '为什么现代 LLM 要在传统残差连接上做创新？有哪些主要方向？',
              'Hyper-Connections 是什么？数据在其中怎样流动？',
              '相比一般 HC，DeepSeek 的 mHC 有什么创新？为什么这样做？',
              'Qwen3.8-Flash-Next 的 Gated HC 与一般 HC 有什么区别？',
              'Kimi 的 AttnRes 在残差连接上做了什么创新？',
          ]
          rope_heads = [
              'RoPE 是什么？为什么要设计一个不同于普通 PE 的 RoPE？',
              'RoPE 的现代演进脉络是什么样的？',
              'RoPE 为什么要对不同位置的 Token 使用相同的频谱？',
          ]

          for h in data_heads + objective_heads + activation_norm_heads + attention_moved_heads + residual_moved_heads + moe_heads + pre_keep_heads:
              if h not in pre_sec:
                  raise RuntimeError(f'预训练缺少预期问题: {h}')
          for h in att_existing_heads:
              if h not in att_sec:
                  raise RuntimeError(f'注意力机制缺少预期问题: {h}')
          for h in res_existing_heads:
              if h not in res_sec:
                  raise RuntimeError(f'残差连接缺少预期问题: {h}')
          for h in rope_heads:
              if h not in rope_sec:
                  raise RuntimeError(f'RoPE 缺少预期问题: {h}')

          def make_note(title, parent_target, parent_label, desc, heads, source_map, child_rows=None, footer=None):
              parts = [
                  f'# {title}',
                  '',
                  f'[[{parent_target}|返回上级：{parent_label}]] · [[main|返回知识主干]]',
                  '',
                  desc,
                  '',
              ]
              if child_rows:
                  parts += ['## 子树', '', '| 子树 | 内容 |', '| --- | --- |']
                  for target, label, blurb in child_rows:
                      parts.append(f'| [[{target}|{label}]] | {blurb} |')
                  parts.append('')
              parts += ['## 问题目录', '']
              parts += [f'- [[{title}#{h}|{h}]]' for h in heads]
              parts += ['', '---', '']
              body = '\n\n---\n\n'.join(source_map[h] for h in heads)
              text = '\n'.join(parts) + body + '\n'
              if footer:
                  text += f'\n---\n\n{footer}\n'
              return text

          # Remove old locations only after all source text is in memory.
          shutil.rmtree(Path('LLM/注意力机制'))
          shutil.rmtree(Path('LLM/残差连接'))
          shutil.rmtree(Path('LLM/预训练/RoPE'))

          pre_children = [
              ('LLM/预训练/预训练数据/预训练数据', '预训练数据', '语料来源、清洗过滤、分类与数据配比'),
              ('LLM/预训练/训练目标/训练目标', '训练目标', 'NTP 以及 MTP、FIM 等辅助训练目标'),
              ('LLM/预训练/激活与归一化/激活与归一化', '激活与归一化', 'ReLU / GELU / SwiGLU、Gated MLP 与各类归一化机制'),
              ('LLM/预训练/注意力机制/注意力机制', '注意力机制', 'MHA、GQA、MLA、KDA 及位置相关机制'),
              ('LLM/预训练/残差连接/残差连接', '残差连接', 'Residual、HC、mHC、Gated Residual 与 AttnRes'),
              ('LLM/预训练/MoE/MoE', 'MoE', '专家路由、specialization 与负载平衡'),
          ]

          pre_new = make_note(
              '预训练', 'LLM/LLM', 'LLM',
              '围绕大语言模型预训练阶段的目标、架构总览、训练系统与基础能力形成整理 Q&A。',
              pre_keep_heads, pre_sec, child_rows=pre_children,
              footer='相关主题：[[LLM]] · [[中训练]] · [[后训练]]',
          )
          pre_path.write_text(pre_new, encoding='utf-8')

          simple_specs = [
              ('预训练数据', data_heads, '围绕预训练语料来源、清洗过滤、数据分类与配比整理 Q&A。'),
              ('训练目标', objective_heads, '围绕语言建模主目标，以及 MTP、FIM 等辅助训练目标整理 Q&A。'),
              ('激活与归一化', activation_norm_heads, '围绕 Transformer FFN 的激活与门控结构，以及归一化机制与位置选择整理 Q&A。'),
              ('MoE', moe_heads, '围绕 Mixture of Experts 的路由、专家专门化与负载平衡机制整理 Q&A。'),
          ]
          for title, heads, desc in simple_specs:
              p = Path('LLM/预训练') / title / f'{title}.md'
              p.parent.mkdir(parents=True, exist_ok=True)
              text = make_note(title, 'LLM/预训练/预训练', '预训练', desc, heads, pre_sec, footer='相关主题：[[预训练]]')
              if title == '激活与归一化':
                  text = text.replace('../../assets/', '../../../assets/')
              p.write_text(text, encoding='utf-8')

          att_map = dict(pre_sec)
          att_map.update(att_sec)
          att_heads = attention_moved_heads + att_existing_heads
          att_path = Path('LLM/预训练/注意力机制/注意力机制.md')
          att_path.parent.mkdir(parents=True, exist_ok=True)
          att_new = make_note(
              '注意力机制', 'LLM/预训练/预训练', '预训练',
              '围绕现代 LLM 中 Full Attention、GQA、MLA、Linear Attention 与位置相关机制的核心原理和演进整理 Q&A。',
              att_heads, att_map,
              child_rows=[('LLM/预训练/注意力机制/RoPE/RoPE', 'RoPE', '旋转位置编码、长上下文扩展与频谱设计')],
              footer='相关主题：[[预训练]] · [[残差连接]]',
          )
          att_new = att_new.replace('../../assets/', '../../../assets/')
          att_path.write_text(att_new, encoding='utf-8')

          res_map = dict(pre_sec)
          res_map.update(res_sec)
          res_heads = [res_existing_heads[0]] + residual_moved_heads + res_existing_heads[1:]
          res_path = Path('LLM/预训练/残差连接/残差连接.md')
          res_path.parent.mkdir(parents=True, exist_ok=True)
          res_new = make_note(
              '残差连接', 'LLM/预训练/预训练', '预训练',
              '围绕现代 LLM 中 residual stream 的信息传播、Hyper-Connections、mHC、Qwen Gated Residual 与 Kimi AttnRes 整理。',
              res_heads, res_map,
              footer='相关主题：[[预训练]] · [[注意力机制]]',
          )
          res_new = res_new.replace('../../assets/', '../../../assets/')
          res_path.write_text(res_new, encoding='utf-8')

          rope_path = Path('LLM/预训练/注意力机制/RoPE/RoPE.md')
          rope_path.parent.mkdir(parents=True, exist_ok=True)
          rope_new = make_note(
              'RoPE', 'LLM/预训练/注意力机制/注意力机制', '注意力机制',
              '围绕旋转位置编码（Rotary Position Embedding, RoPE）的基本原理、长上下文扩展和频谱设计整理 Q&A。',
              rope_heads, rope_sec,
              footer='相关主题：[[注意力机制]] · [[预训练]]',
          )
          rope_new = rope_new.replace('../../../assets/', '../../../../assets/')
          rope_path.write_text(rope_new, encoding='utf-8')

          # LLM direct children: architecture mechanisms are now under Pre-training.
          llm_path = Path('LLM/LLM.md')
          llm = llm_path.read_text(encoding='utf-8')
          llm_subtree = '''## 子树

| 子树 | 内容 |
| --- | --- |
| [[LLM/预训练/预训练|预训练]] | 大规模通用数据上的基础能力、架构与训练机制 |
| [[LLM/中训练/中训练|中训练]] | 继续训练中的定向能力强化 |
| [[LLM/后训练/后训练|后训练]] | SFT、偏好优化、强化学习、自训练与蒸馏等行为塑造 |
| [[LLM/部署/部署|部署]] | 模型推理服务的资源、性能、可靠性与成本 |

'''
          llm = re.sub(r'(?s)## 子树\n.*?(?=## 问题目录\n)', llm_subtree, llm, count=1)
          llm_path.write_text(llm, encoding='utf-8')

          # Main reflects the real recursive hierarchy.
          main_path = Path('main.md')
          main = main_path.read_text(encoding='utf-8')
          main_llm = '''## LLM

- [LLM](LLM/LLM.md)
  - [预训练](LLM/预训练/预训练.md)
    - [预训练数据](LLM/预训练/预训练数据/预训练数据.md)
    - [训练目标](LLM/预训练/训练目标/训练目标.md)
    - [激活与归一化](LLM/预训练/激活与归一化/激活与归一化.md)
    - [注意力机制](LLM/预训练/注意力机制/注意力机制.md)
      - [RoPE](LLM/预训练/注意力机制/RoPE/RoPE.md)
    - [残差连接](LLM/预训练/残差连接/残差连接.md)
    - [MoE](LLM/预训练/MoE/MoE.md)
  - [中训练](LLM/中训练/中训练.md)
  - [后训练](LLM/后训练/后训练.md)
    - [微调](LLM/后训练/微调/微调.md)
  - [部署](LLM/部署/部署.md)

'''
          main = re.sub(r'(?s)## LLM\n.*?(?=## Agent\n)', main_llm, main, count=1)
          main_path.write_text(main, encoding='utf-8')

          # Fix Context ambiguity using a unique vault path everywhere.
          for p in ROOT.rglob('*.md'):
              text = p.read_text(encoding='utf-8')
              text = text.replace('[[context#', '[[Agent/Context/context#')
              text = text.replace('[[context|', '[[Agent/Context/context|')
              text = text.replace('[[context]]', '[[Agent/Context/context|Context]]')
              p.write_text(text, encoding='utf-8')

          # Redirect links to Q&A leaves that moved out of pre-training.md.
          moved = {
              '预训练数据': data_heads,
              '训练目标': objective_heads,
              '激活与归一化': activation_norm_heads,
              '注意力机制': attention_moved_heads,
              '残差连接': residual_moved_heads,
              'MoE': moe_heads,
          }
          for p in ROOT.rglob('*.md'):
              text = p.read_text(encoding='utf-8')
              for target, heads in moved.items():
                  for h in heads:
                      text = text.replace(f'[[预训练#{h}', f'[[{target}#{h}')
              p.write_text(text, encoding='utf-8')

          # Prevent future navigation ambiguity.
          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text(encoding='utf-8')
          rule = '- Tree 的结构导航应使用能够唯一定位的 vault 路径；存在同名目录 / 文件、大小写差异或文件曾经移动时，不依赖裸文件名解析，避免 Obsidian 因歧义跳到错误目标。\n'
          anchor = '- 每个 Tree 的 Markdown 顶部都必须提供向上导航。一级 Tree 的直接上级就是 `main.md`，因此只保留一个“返回知识主干”链接；二级及更深 Tree 必须同时提供“返回上级 Tree”和“返回知识主干”两个入口。可以在其后保留少量有阅读价值的横向关联链接，但不能替代这两个向上入口。\n'
          if rule not in agents:
              if anchor not in agents:
                  raise RuntimeError('AGENTS.md 中未找到导航规则锚点')
              agents = agents.replace(anchor, anchor + rule, 1)
          agents_path.write_text(agents, encoding='utf-8')

          # Invariants before committing.
          assert not Path('LLM/注意力机制').exists()
          assert not Path('LLM/残差连接').exists()
          assert not Path('LLM/预训练/RoPE').exists()
          assert Path('LLM/预训练/注意力机制/RoPE/RoPE.md').exists()
          assert '[[context|' not in '\n'.join(p.read_text(encoding='utf-8') for p in ROOT.rglob('*.md'))
          assert '[[context#' not in '\n'.join(p.read_text(encoding='utf-8') for p in ROOT.rglob('*.md'))
          for target, heads in moved.items():
              all_md = '\n'.join(p.read_text(encoding='utf-8') for p in ROOT.rglob('*.md'))
              for h in heads:
                  assert f'[[预训练#{h}' not in all_md, h

          # The workflow is migration-only and must not remain in the vault.
          Path('.github/workflows/rewrite-main-backlinks.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refine pretraining tree and fix Context navigation"
            git push
          fi
