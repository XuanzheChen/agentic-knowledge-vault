name: Apply pretraining migration

on:
  push:
    branches:
      - reorganize-knowledge-forest
    paths:
      - '.github/workflows/rewrite-main-backlinks.yml'
      - '.github/migrate_pretraining.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reorganize-knowledge-forest
          fetch-depth: 0
      - name: Apply migration
        run: python .github/migrate_pretraining.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine pretraining hierarchy and fix Context navigation"
          git push origin HEAD:reorganize-knowledge-forest
