name: Rewrite main backlinks

on:
  push:
    branches:
      - reorganize-knowledge-forest

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reorganize-knowledge-forest
      - name: Rewrite legacy index backlinks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '[[index|返回知识索引]]'
          new = '[[main|返回知识主干]]'
          changed = []

          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('\n'.join(changed))
          PY
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/rewrite-main-backlinks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update backlinks from index to main"
            git push origin HEAD:reorganize-knowledge-forest
          fi
