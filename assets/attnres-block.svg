<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840">
<style>
text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.sub{font-size:11px}
.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.b{fill:#eaf3ff;stroke:#3b82f6;stroke-width:2}.g{fill:#edf9f0;stroke:#38a169;stroke-width:2}.o{fill:#fff4e8;stroke:#e58a2c;stroke-width:2}.p{fill:#f3edff;stroke:#805ad5;stroke-width:2}
.line{stroke:#394b63;stroke-width:2.5;fill:none;marker-end:url(#a)}.bus{stroke:#64748b;stroke-width:2.2;fill:none}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#394b63"/></marker></defs>

<text x="38" y="50" class="t">Kimi AttnRes：沿“深度轴”选择历史表示</text>
<text x="38" y="82" class="s">Self-Attention 沿 token 轴选择信息；AttnRes 对同一个 token 沿 layer / block 深度选择信息。</text>

<!-- Full AttnRes -->
<text x="58" y="128" class="h">Full AttnRes（概念）</text>

<rect x="55" y="155" width="220" height="62" class="b" rx="10"/>
<text x="88" y="181" class="s">embedding source</text>
<text x="112" y="204" class="s">b</text><text x="124" y="210" class="sub">0</text><text x="140" y="204" class="s">，hidden size d</text>

<rect x="55" y="235" width="220" height="62" class="g" rx="10"/>
<text x="92" y="273" class="s">layer 1 output</text>

<rect x="55" y="315" width="220" height="62" class="g" rx="10"/>
<text x="92" y="353" class="s">layer 2 output</text>

<text x="155" y="410" class="h">⋮</text>

<rect x="55" y="430" width="220" height="62" class="g" rx="10"/>
<text x="88" y="468" class="s">layer (l−1) output</text>

<!-- Lines into depth attention: explicit parallel inputs -->
<path d="M275 186 L430 186" class="line"/>
<path d="M275 266 L430 266" class="line"/>
<path d="M275 346 L430 346" class="line"/>
<path d="M275 461 L430 461" class="line"/>

<rect x="435" y="155" width="300" height="337" class="o" rx="12"/>
<text x="510" y="195" class="h">Depth Attention</text>
<text x="470" y="233" class="s">1. 每个历史 source 先做 RMSNorm</text>
<text x="470" y="270" class="s">2. 当前层有 learnable pseudo-query w</text><text x="723" y="276" class="sub">l</text>
<text x="470" y="307" class="s">3. w</text><text x="504" y="313" class="sub">l</text><text x="518" y="307" class="s"> 与每个 source 点积得到 score</text>
<text x="470" y="344" class="s">4. softmax 只沿“历史深度”维</text>
<text x="470" y="381" class="s">5. 对各 source 做加权求和</text>
<text x="470" y="430" class="s">输出当前层输入 h</text><text x="600" y="436" class="sub">l</text>
<text x="470" y="458" class="s">形状仍为 hidden size d</text>

<path d="M735 324 L830 324" class="line"/>
<rect x="835" y="270" width="210" height="108" class="p" rx="10"/>
<text x="891" y="307" class="h">当前子层</text>
<text x="877" y="340" class="s">Attention / FFN</text>
<text x="884" y="366" class="s">读取 depth-mixed h</text><text x="1021" y="372" class="sub">l</text>

<rect x="1080" y="220" width="190" height="208" class="box" rx="10"/>
<text x="1109" y="258" class="h">关键区别</text>
<text x="1105" y="295" class="s">不是：</text>
<text x="1105" y="322" class="s">token → token</text>
<text x="1105" y="358" class="s">而是：</text>
<text x="1105" y="385" class="s">depth source</text>
<text x="1105" y="410" class="s">→ 当前层</text>

<!-- Block AttnRes -->
<text x="58" y="548" class="h">Block AttnRes（Kimi K3 实际采用）</text>
<text x="58" y="578" class="s">历史 block 是并列 memory source，不是顺序串联；当前 block 额外保留一个 partial sum。</text>

<rect x="60" y="610" width="205" height="80" class="b" rx="10"/>
<text x="105" y="643" class="s">embedding source</text>
<text x="130" y="670" class="s">b</text><text x="142" y="676" class="sub">0</text>

<rect x="300" y="610" width="205" height="80" class="g" rx="10"/>
<text x="356" y="640" class="s">completed block 1</text>
<text x="331" y="668" class="s">block 内输出汇总 → b</text><text x="484" y="674" class="sub">1</text>

<rect x="540" y="610" width="205" height="80" class="g" rx="10"/>
<text x="596" y="640" class="s">completed block 2</text>
<text x="571" y="668" class="s">block 内输出汇总 → b</text><text x="724" y="674" class="sub">2</text>

<rect x="780" y="610" width="235" height="80" class="o" rx="10"/>
<text x="833" y="640" class="s">current block</text>
<text x="806" y="668" class="s">当前已计算层的 partial sum</text>

<!-- parallel sources into collector -->
<path d="M162 690 L162 723" class="bus"/>
<path d="M402 690 L402 723" class="bus"/>
<path d="M642 690 L642 723" class="bus"/>
<path d="M897 690 L897 723" class="bus"/>
<path d="M162 723 L897 723" class="bus"/>
<path d="M897 723 L1050 723" class="line"/>

<rect x="1055" y="670" width="225" height="108" class="p" rx="10"/>
<text x="1080" y="705" class="h">Depth Attention</text>
<text x="1081" y="737" class="s">对 block sources 做 softmax</text>
<text x="1081" y="763" class="s">再加权汇聚为当前层输入</text>

<text x="60" y="808" class="s">Block 化的目的：保留“按内容选择历史深度”的能力，同时把长期保存的 source 数量从 layer 数 L 降到 block 数 N。</text>
</svg>