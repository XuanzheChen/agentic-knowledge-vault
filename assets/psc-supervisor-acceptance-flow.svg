<svg width="2580" height="2040" viewBox="0 0 2580 2040" xmlns="http://www.w3.org/2000/svg"><defs><style><![CDATA[
 text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}
 ]]></style><marker id="a" markerHeight="9" markerWidth="9" orient="auto" refX="10" refY="6" viewBox="0 0 12 12"><path d="m1 1 10 5-10 5z" fill="#8191AA"/></marker><filter id="b" x="-12%" y="-20%" width="135%" height="150%"><feDropShadow dx="0" dy="6" flood-color="#21324A" flood-opacity=".075" stdDeviation="10"/></filter></defs><rect width="2580" height="2040" fill="#F6F8FC"/><rect width="2580" height="11" fill="#4F6FE8"/><text x="94" y="72" fill="#5572D5" font-size="23" font-weight="800">PSC / EXECUTOR ACCEPTANCE</text><text x="94" y="149" fill="#16263D" font-size="53" font-weight="850">Executor 说“完成了”之后，Supervisor 如何真正验收？</text><text x="95" y="200" fill="#60718B" font-size="25" font-weight="500">以 FastAPI 接口开发任务为例 · 依据仓库现有实现 · 区分模型主张、确定性证据与独立验证</text><rect x="2040" y="59" width="439" height="92" rx="17" fill="#E9EEFF" stroke="#D5DFFF" stroke-width="2"/><text x="2064" y="96" fill="#3C5BD2" font-size="20" font-weight="800">关键原则</text><text x="2064" y="130" fill="#23418C" font-size="26" font-weight="800">执行成功 ≠ 验收成功</text><rect x="94" y="245" width="151" height="35" rx="12" fill="#E7F0FF"/><text x="109" y="270" fill="#245FBD" font-size="18" font-weight="650">验收标准源</text><rect x="280" y="239" width="2201" height="95" rx="18" fill="#EEF4FE" stroke="#D4E3FB" stroke-width="2"/><text x="314" y="276" fill="#224A87" font-size="27" font-weight="800">Approved Contract / Task</text><text x="314" y="311" fill="#45648A" font-size="24" font-weight="550">REQ · AC · Allowed / Forbidden Scope · 任务约束与必须满足的验收条件</text><rect x="94" y="370" width="277" height="35" rx="12" fill="#E6E9FC"/><text x="109" y="395" fill="#4C60BE" font-size="18" font-weight="650">01 完成报告与实际执行</text><rect x="94" y="422" width="676" height="264" rx="20" fill="#FAFBFF" filter="url(#b)" stroke="#D7E0F7" stroke-width="2"/><rect x="116" y="449" width="8" height="210" rx="4" fill="#5973D6"/><text x="141" y="478" fill="#5973D6" font-size="20" font-weight="800">E · LLM OUTPUT</text><text x="141" y="525" fill="#17283E" font-size="33" font-weight="800">Executor 的完成声明</text><text x="141" y="573" fill="#52647D" font-size="24" font-weight="500">“接口已实现，所有测试通过”</text><text x="141" y="611" fill="#52647D" font-size="24" font-weight="500">结构化 Completion：文件 / 测试 / 风险</text><text x="141" y="649" fill="#52647D" font-size="24" font-weight="500">只作为检查线索，不能直接授予 PASS</text><rect x="951" y="422" width="716" height="264" rx="20" fill="#F9FCFF" filter="url(#b)" stroke="#CFE1F7" stroke-width="2"/><rect x="973" y="449" width="8" height="210" rx="4" fill="#4A74BD"/><text x="998" y="478" fill="#4A74BD" font-size="20" font-weight="800">R · DETERMINISTIC CAPTURE</text><text x="998" y="525" fill="#17283E" font-size="33" font-weight="800">Runtime 独立采集事实</text><text x="998" y="573" fill="#52647D" font-size="24" font-weight="500">_git_snapshot()：执行前 / 执行后</text><text x="998" y="611" fill="#52647D" font-size="24" font-weight="500">changed_paths + _scope_violations()</text><text x="998" y="649" fill="#52647D" font-size="24" font-weight="500">日志、输出解析 → plan.md / coding.md</text><rect x="1850" y="422" width="630" height="264" rx="20" fill="#F8FFFC" filter="url(#b)" stroke="#CDE9E0" stroke-width="2"/><rect x="1872" y="449" width="8" height="210" rx="4" fill="#1C8A7B"/><text x="1897" y="478" fill="#1C8A7B" font-size="20" font-weight="800">S · EVIDENCE INPUT</text><text x="1897" y="525" fill="#17283E" font-size="33" font-weight="800">证据送达 Supervisor</text><text x="1897" y="573" fill="#52647D" font-size="24" font-weight="500">同时看到：E 的声明与 Runtime 记录</text><text x="1897" y="611" fill="#52647D" font-size="24" font-weight="500">核对真实修改文件 / 执行日志</text><text x="1897" y="649" fill="#52647D" font-size="24" font-weight="500">必要时读取完整 Diff 和代码实现</text><polyline points="772 560 944 560" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="1669 560 1842 560" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><rect x="785" y="511" width="128" height="35" rx="12" fill="#EEF2FA"/><text x="800" y="536" fill="#536E9A" font-size="18" font-weight="650">执行回执</text><rect x="1690" y="511" width="127" height="35" rx="12" fill="#E6F7F1"/><text x="1705" y="536" fill="#277B74" font-size="18" font-weight="650">真实证据</text><rect x="94" y="723" width="292" height="35" rx="12" fill="#E2F7EE"/><text x="109" y="748" fill="#0F7A72" font-size="18" font-weight="650">02 证据驱动的独立验证</text><rect x="94" y="773" width="1140" height="299" rx="22" fill="#fff" filter="url(#b)" stroke="#CBE5DC" stroke-width="2"/><rect x="121" y="804" width="9" height="237" rx="4" fill="#22A68E"/><text x="157" y="843" fill="#173C49" font-size="32" font-weight="800">Runtime 已验证的事实（部分确定性）</text><text x="157" y="895" fill="#46677A" font-size="25" font-weight="520">① 实际 changed_paths 是否越过 Allowed / Forbidden Scope？</text><text x="157" y="937" fill="#46677A" font-size="25" font-weight="520">② 进程、Completion 和日志的真实状态是什么？</text><text x="157" y="979" fill="#46677A" font-size="25" font-weight="520">③ 执行记录、任务绑定和状态是否可追溯？</text><text x="157" y="1021" fill="#46677A" font-size="25" font-weight="520">注意：这些检查不等于证明接口功能完全正确</text><rect x="1302" y="773" width="1178" height="299" rx="22" fill="#fff" filter="url(#b)" stroke="#C9DBF8" stroke-width="2"/><rect x="1329" y="804" width="9" height="237" rx="4" fill="#5379D7"/><text x="1367" y="843" fill="#173C49" font-size="32" font-weight="800">Supervisor 负责的语义验收（LLM + 实测）</text><text x="1367" y="895" fill="#46677A" font-size="25" font-weight="520">① 重新读取 Contract 中逐条 AC / Task 要求</text><text x="1367" y="937" fill="#46677A" font-size="25" font-weight="520">② 独立审查 Git Diff、实际代码及必要测试结果</text><text x="1367" y="979" fill="#46677A" font-size="25" font-weight="520">③ FastAPI：路由 / 响应 / 参数校验 / 异常处理</text><text x="1367" y="1021" fill="#46677A" font-size="25" font-weight="520">④ 为关键验收项找到对应代码或可执行证据</text><polyline points="1238 920 1294 920" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="1288 1080 1288 1118" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><rect x="94" y="1110" width="290" height="35" rx="12" fill="#F2EAFB"/><text x="109" y="1135" fill="#8558B9" font-size="18" font-weight="650">03 Supervisor 作出结论</text><path d="m1288 1164 332 101-332 101-332-101z" fill="#F3EEFF" filter="url(#b)" stroke="#A58DD7" stroke-width="3"/><text x="1288" y="1250" fill="#4D3987" font-size="30" font-weight="800" text-anchor="middle">实际产品是否满足全部必要 AC？</text><text x="1288" y="1290" fill="#695394" font-size="26" font-weight="600" text-anchor="middle">证据充分且无安全阻断？</text><polyline points="1288 1368 1288 1407" fill="none" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="350 1407 2260 1407" fill="none" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="350 1407 350 1440" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="960 1407 960 1440" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="1603 1407 1603 1440" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><polyline points="2260 1407 2260 1440" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><rect x="94" y="1452" width="542" height="207" rx="20" fill="#EAF9F2" filter="url(#b)" stroke="#199078" stroke-width="2"/><rect x="111" y="1471" width="7" height="171" rx="4" fill="#199078"/><text x="133" y="1492" fill="#199078" font-size="17" font-weight="800">AC 满足 + 范围安全</text><text x="133" y="1540" fill="#213148" font-size="29" font-weight="800">PASS</text><text x="133" y="1581" fill="#52647D" font-size="21" font-weight="520">保留 Review，生成 Result</text><text x="133" y="1612" fill="#52647D" font-size="21" font-weight="520">推进下一任务 / workflow_passed</text><rect x="666" y="1452" width="572" height="207" rx="20" fill="#FFF5E9" filter="url(#b)" stroke="#D08A31" stroke-width="2"/><rect x="683" y="1471" width="7" height="171" rx="4" fill="#D08A31"/><text x="705" y="1492" fill="#D08A31" font-size="17" font-weight="800">确认存在真实功能或质量缺陷</text><text x="705" y="1540" fill="#213148" font-size="29" font-weight="800">quality_rework</text><text x="705" y="1581" fill="#52647D" font-size="21" font-weight="520">Review 明确问题与修改目标</text><text x="705" y="1612" fill="#52647D" font-size="21" font-weight="520">带 previous_review 重派 E</text><rect x="1268" y="1452" width="640" height="207" rx="20" fill="#FFF2EA" filter="url(#b)" stroke="#C4754E" stroke-width="2"/><rect x="1285" y="1471" width="7" height="171" rx="4" fill="#C4754E"/><text x="1307" y="1492" fill="#C4754E" font-size="17" font-weight="800">E 异常且任务仍未完成 / 未验证</text><text x="1307" y="1540" fill="#213148" font-size="29" font-weight="800">abnormal_retry</text><text x="1307" y="1581" fill="#52647D" font-size="21" font-weight="520">仅作为下次派发的 retry_kind</text><text x="1307" y="1612" fill="#52647D" font-size="21" font-weight="520">与质量返工额度独立计数</text><rect x="1938" y="1452" width="542" height="207" rx="20" fill="#FFF0F3" filter="url(#b)" stroke="#B75A72" stroke-width="2"/><rect x="1955" y="1471" width="7" height="171" rx="4" fill="#B75A72"/><text x="1977" y="1492" fill="#B75A72" font-size="17" font-weight="800">硬阻断 / 需求必须修订</text><text x="1977" y="1540" fill="#213148" font-size="29" font-weight="800">blocked / waiting_planner</text><text x="1977" y="1581" fill="#52647D" font-size="21" font-weight="520">禁止越界 PASS；需修复或升级</text><text x="1977" y="1612" fill="#52647D" font-size="21" font-weight="520">必要时由 Planner 修订 Contract</text><rect x="186" y="1370" width="115" height="35" rx="12" fill="#E4F6EF"/><text x="201" y="1395" fill="#138574" font-size="18" font-weight="650">充分证据</text><rect x="769" y="1370" width="105" height="35" rx="12" fill="#FFF0DD"/><text x="784" y="1395" fill="#AF762D" font-size="18" font-weight="650">需修复</text><rect x="1454" y="1370" width="158" height="35" rx="12" fill="#FFF0E8"/><text x="1469" y="1395" fill="#BD744E" font-size="18" font-weight="650">异常且未验证</text><rect x="2147" y="1370" width="158" height="35" rx="12" fill="#FFE9EE"/><text x="2162" y="1395" fill="#A65067" font-size="18" font-weight="650">阻断 / 变更</text><rect x="94" y="1701" width="2386" height="125" rx="18" fill="#EAF0FE" stroke="#C8D8F4" stroke-width="2"/><text x="129" y="1745" fill="#244A91" font-size="29" font-weight="800">正式状态提交：psc_commit_supervisor_transition()</text><text x="129" y="1784" fill="#456282" font-size="22" font-weight="520">Runtime 校验当前 Task、Contract vN、可选 State SHA、Scope / Runtime 阻断；持久化 review.md、PASS 的 result.md 和状态 / Resume。</text><text x="129" y="1814" fill="#607592" font-size="19" font-weight="520">注：abnormal_retry 是重新派发时的 retry_kind，不是 commit_supervisor_transition 的 decision 枚举值。</text><polyline points="348 1663 348 1696" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><polyline points="955 1663 955 1696" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><polyline points="2221 1663 2221 1696" fill="none" marker-end="url(#a)" stroke="#8191AA" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><rect x="94" y="1855" width="1135" height="135" rx="18" fill="#E6F7EF" stroke="#B7E6D0" stroke-width="2"/><text x="121" y="1899" fill="#116D5E" font-size="25" font-weight="800">特殊情况 · E 的协议 / 输出异常，但产品已独立验证通过</text><text x="121" y="1940" fill="#446C65" font-size="21" font-weight="520">满足 AC、无越界 / 硬阻断 → 仍可 PASS；保留原始失败事实与异常审计。</text><rect x="1252" y="1855" width="1228" height="135" rx="18" fill="#FFF4E5" stroke="#F0DCB5" stroke-width="2"/><text x="1279" y="1899" fill="#A1661C" font-size="25" font-weight="800">实现边界 · 当前不存在通用的“自动证明全部 AC”验证器</text><text x="1279" y="1940" fill="#856B4A" font-size="21" font-weight="520">Runtime 不会自行跑完全部测试并准入 PASS；质量判断仍依赖 Supervisor。</text><text x="95" y="2022" fill="#8A98AD" font-size="19" font-weight="500">源码依据：scripts/invoke_executor.py · scripts/psc_mcp_server.py · scripts/supervisor_runtime.py · references/runtime-protocol.md</text></svg>