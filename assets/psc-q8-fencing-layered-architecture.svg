<svg baseProfile="full" height="2160" version="1.1" viewBox="0 0 3280 2160" width="3280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8397AD" /></marker><marker id="arrred" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B54D5A" /></marker><marker id="arrgreen" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#11816B" /></marker></defs><rect fill="#F5F7FB" height="2160" width="3280" x="0" y="0" /><rect fill="#3176CF" height="13" width="3280" x="0" y="0" /><text fill="#3176CF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="800" text-anchor="start" x="85" y="80">PSC · FENCING TOKEN / EXECUTION SAFETY</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="58" font-weight="800" text-anchor="start" x="85" y="146">旧 Executor 失去执行权后，如何阻止它继续破坏代码？</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="500" text-anchor="start" x="85" y="194">Q8 · 文件锁、强制工作区隔离和受控提交的三层防线</text><rect fill="#F0EDFF" height="42" rx="13" ry="13" stroke="#F0EDFF" stroke-width="1" width="470" x="2700" y="69" /><text fill="#7355C7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" text-anchor="middle" x="2935.0" y="99">现状 + 后续方案</text><rect fill="#FFF0F1" height="130" rx="21" ry="21" stroke="#F1C7CF" stroke-width="2.2" width="3110" x="85" y="230" /><rect fill="#B54D5A" height="42" rx="13" ry="13" stroke="#B54D5A" stroke-width="1" width="150" x="109" y="255" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" text-anchor="middle" x="184.0" y="285">危险竞态</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="289" y="287">MCP Server 崩溃 → 文件锁释放 → B 获锁；但 A 仍在运行并修改文件</text><text fill="#B54D5A" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600" text-anchor="start" x="290" y="329">结论：锁丢失不代表旧执行器失去写权限。仅依靠锁或 Prompt，无法排除两个写入者。</text><rect fill="#FFFFFF" height="66" rx="20" ry="20" stroke="#DDE6F0" stroke-width="1.2" width="3100" x="80" y="390" /><rect fill="#3176CF" height="39" rx="12" ry="12" stroke="#3176CF" stroke-width="1" width="45" x="96" y="403" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="800" text-anchor="middle" x="118" y="431">01</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="159" y="434">调度控制层（Control Plane）</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" text-anchor="start" x="1730" y="433">锁控制“谁能开始”；执行代际标识“当前谁有权提交”</text><rect fill="#E9F3FF" height="220" rx="25" ry="25" stroke="#B4D4F5" stroke-width="2.4" width="605" x="100" y="485" /><rect fill="#3176CF" height="170" rx="4" ry="4" stroke="#3176CF" stroke-width="1" width="8" x="119" y="510" /><text fill="#3176CF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="151" y="538">已实现：文件锁</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="151" y="597">Executor A · 第 10 代</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="151" y="649">持有 executor-dispatch.lock</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="151" y="687">当前 PSC：同工作流调度互斥</text><rect fill="#FFF0F1" height="220" rx="25" ry="25" stroke="#F1C7CF" stroke-width="2.4" width="605" x="809" y="485" /><rect fill="#B54D5A" height="170" rx="4" ry="4" stroke="#B54D5A" stroke-width="1" width="8" x="828" y="510" /><text fill="#B54D5A" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="860" y="538">故障：执行权不确定</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="860" y="597">管理进程意外崩溃</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="860" y="649">OS 释放锁，但 A 可能存活</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="860" y="687">这不等于已确认 A 退出</text><rect fill="#F0EDFF" height="220" rx="25" ry="25" stroke="#CFCAF4" stroke-width="2.4" width="785" x="1518" y="485" /><rect fill="#7355C7" height="170" rx="4" ry="4" stroke="#7355C7" stroke-width="1" width="8" x="1537" y="510" /><text fill="#7355C7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="1569" y="538">待设计：运行时控制器</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="1569" y="597">恢复仲裁与执行代际</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="1569" y="649">依赖强一致的执行权登记</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="1569" y="687">确认新任务只能使用隔离工作区</text><rect fill="#F0EDFF" height="220" rx="25" ry="25" stroke="#CFCAF4" stroke-width="2.4" width="775" x="2408" y="485" /><rect fill="#7355C7" height="170" rx="4" ry="4" stroke="#7355C7" stroke-width="1" width="8" x="2427" y="510" /><text fill="#7355C7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="2459" y="538">待设计：身份切换</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="2459" y="597">Executor B · 第 11 代</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="2459" y="649">原子递增 fencing token：10 → 11</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="500" text-anchor="start" x="2459" y="687">第 10 代结果不再具有提交资格</text><path d="M 717 593 H 799" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><path d="M 1426 593 H 1508" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><path d="M 2315 593 H 2398" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><rect fill="#FFF5E9" height="75" rx="17" ry="17" stroke="#F5D9B8" stroke-width="1.6" width="3090" x="94" y="732" /><rect fill="#B67420" height="42" rx="13" ry="13" stroke="#B67420" stroke-width="1" width="149" x="115" y="749" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" text-anchor="middle" x="189.5" y="779">接管前提</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="294" y="777">无法确认旧写入已终止且没有强制隔离 → 阻断接管；已有隔离与受控提交 → 可分配新代际。</text><rect fill="#FFFFFF" height="66" rx="20" ry="20" stroke="#DDE6F0" stroke-width="1.2" width="3100" x="80" y="835" /><rect fill="#11816B" height="39" rx="12" ry="12" stroke="#11816B" stroke-width="1" width="45" x="96" y="848" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="800" text-anchor="middle" x="118" y="876">02</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="159" y="879">执行写入层（Execution Plane）</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" text-anchor="start" x="1730" y="878">每次执行拥有独立沙箱；失效进程依旧无法写到其他工作区</text><rect fill="#FFF0F1" height="300" rx="25" ry="25" stroke="#F1C7CF" stroke-width="2.4" width="1430" x="108" y="946" /><rect fill="#B54D5A" height="250" rx="4" ry="4" stroke="#B54D5A" stroke-width="1" width="8" x="127" y="971" /><text fill="#B54D5A" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="159" y="999">旧身份 / 旧工作区</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="159" y="1058">旧 Executor A：仍可能存活</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="500" text-anchor="start" x="159" y="1110">worktree-A / sandbox-A    ·    token = 10（过期）</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="500" text-anchor="start" x="159" y="1148">即使继续执行，也只能写入 A 专属工作区</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="500" text-anchor="start" x="159" y="1186">无权直接写共享目录、B 工作区或正式分支</text><rect fill="#E9F8F1" height="300" rx="25" ry="25" stroke="#B4E5D0" stroke-width="2.4" width="1435" x="1740" y="946" /><rect fill="#11816B" height="250" rx="4" ry="4" stroke="#11816B" stroke-width="1" width="8" x="1759" y="971" /><text fill="#11816B" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="1791" y="999">新身份 / 新工作区</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="1791" y="1058">新 Executor B：合法接管</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="500" text-anchor="start" x="1791" y="1110">worktree-B / sandbox-B    ·    token = 11（当前）</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="500" text-anchor="start" x="1791" y="1148">从可信 Git Base 创建全新隔离工作区</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="500" text-anchor="start" x="1791" y="1186">独立修改、测试；不与 A 共用可写文件</text><path d="M 381 710 V 916 H 810 V 935" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M 2810 710 V 934" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line stroke="#11816B" stroke-dasharray="12,12" stroke-width="4" x1="1635" x2="1635" y1="962" y2="1227" /><rect fill="#E9F8F1" height="42" rx="13" ry="13" stroke="#E9F8F1" stroke-width="1" width="152" x="1559" y="1056" /><text fill="#11816B" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" text-anchor="middle" x="1635.0" y="1086">隔离边界</text><rect fill="#FFFFFF" height="104" rx="17" ry="17" stroke="#DDE6F0" stroke-width="1.7" width="3068" x="107" y="1276" /><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="136" y="1318">关键限制：Git Worktree 只提供目录分离；要真正阻止 A 跨目录写入，必须配合容器挂载策略 / OS 文件权限。</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" text-anchor="start" x="136" y="1353">Job Object / 进程组 / cgroup 可辅助回收孤儿进程，但不能替代强制的写权限边界。</text><rect fill="#FFFFFF" height="66" rx="20" ry="20" stroke="#DDE6F0" stroke-width="1.2" width="3100" x="80" y="1407" /><rect fill="#7355C7" height="39" rx="12" ry="12" stroke="#7355C7" stroke-width="1" width="45" x="96" y="1420" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="800" text-anchor="middle" x="118" y="1448">03</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="159" y="1451">结果生效层（Commit Plane）</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" text-anchor="start" x="1730" y="1450">唯一受控的代码提交者：原子检查执行代际 + Git 基线 + 验收</text><rect fill="#FFF0F1" height="188" rx="25" ry="25" stroke="#F1C7CF" stroke-width="2.4" width="745" x="108" y="1504" /><rect fill="#B54D5A" height="138" rx="4" ry="4" stroke="#B54D5A" stroke-width="1" width="8" x="127" y="1529" /><text fill="#B54D5A" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="159" y="1557">旧结果请求</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="159" y="1616">A 提交旧结果</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" text-anchor="start" x="159" y="1668">run=A · epoch=10 · 旧工作区产物</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" text-anchor="start" x="159" y="1706">可能内容正确，但提交资格已失效</text><rect fill="#F0EDFF" height="255" rx="25" ry="25" stroke="#CFCAF4" stroke-width="2.4" width="1250" x="981" y="1483" /><rect fill="#7355C7" height="205" rx="4" ry="4" stroke="#7355C7" stroke-width="1" width="8" x="1000" y="1508" /><text fill="#7355C7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="1032" y="1536">待设计：Fencing + Atomic Commit</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="1032" y="1595">受控提交服务（唯一有主分支写权限）</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="500" text-anchor="start" x="1032" y="1647">① 读取权威当前代际 11，核对 Run ID / Task ID</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="500" text-anchor="start" x="1032" y="1685">② Contract 验收、Scope / 测试证据、Git base SHA</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="500" text-anchor="start" x="1032" y="1723">③ 在同一受控临界区中原子校验与 CAS 更新</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="500" text-anchor="start" x="1032" y="1761">④ 提交成功后持久化 accepted_run；防止二次接受</text><rect fill="#E9F8F1" height="188" rx="25" ry="25" stroke="#B4E5D0" stroke-width="2.4" width="815" x="2354" y="1504" /><rect fill="#11816B" height="138" rx="4" ry="4" stroke="#11816B" stroke-width="1" width="8" x="2373" y="1529" /><text fill="#11816B" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="800" text-anchor="start" x="2405" y="1557">当前结果请求</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="800" text-anchor="start" x="2405" y="1616">B 提交新结果</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" text-anchor="start" x="2405" y="1668">run=B · epoch=11 · 新工作区产物</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" text-anchor="start" x="2405" y="1706">需要通过相同的证据和版本验证</text><path d="M 866 1604 H 973" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><path d="M 2344 1604 H 2240" fill="none" marker-end="url(#arr)" stroke="#8397AD" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><rect fill="#FFF0F1" height="130" rx="22" ry="22" stroke="#F1C7CF" stroke-width="2" width="745" x="108" y="1770" /><rect fill="#B54D5A" height="42" rx="13" ry="13" stroke="#B54D5A" stroke-width="1" width="193" x="126" y="1784" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" text-anchor="middle" x="222.5" y="1814">REJECT · v10</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" text-anchor="start" x="134" y="1861">A 被拒绝：过期身份无法合并正式代码</text><rect fill="#E9F8F1" height="130" rx="22" ry="22" stroke="#B4E5D0" stroke-width="2" width="815" x="2354" y="1770" /><rect fill="#11816B" height="42" rx="13" ry="13" stroke="#11816B" stroke-width="1" width="210" x="2372" y="1784" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="800" text-anchor="middle" x="2477.0" y="1814">ACCEPT · v11</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" text-anchor="start" x="2380" y="1861">B 验收通过 + 原子提交才可生效</text><path d="M 1130 1741 V 1800 H 867" fill="none" marker-end="url(#arrred)" stroke="#B54D5A" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M 2082 1741 V 1800 H 2337" fill="none" marker-end="url(#arrgreen)" stroke="#11816B" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#FFFFFF" height="135" rx="20" ry="20" stroke="#DDE6F0" stroke-width="1.5" width="3065" x="107" y="1932" /><text fill="#3176CF" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="800" text-anchor="start" x="139" y="1979">三层职责</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="800" text-anchor="start" x="340" y="1979">锁：限制派发</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="800" text-anchor="start" x="870" y="1979">隔离：限制实际写入</text><text fill="#12263E" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="800" text-anchor="start" x="1610" y="1979">Fencing Token + 原子门：限制结果生效</text><text fill="#596E87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" text-anchor="start" x="140" y="2035">实现状态：文件锁、execution_owner、expected_state_sha256、历史文件指纹已存在；单调代际、强制隔离、原子受控提交仍待建设。</text><text fill="#8294AA" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="600" text-anchor="start" x="87" y="2120">SOURCE  ·  scripts/psc_mcp_server.py  ·  scripts/workflow_registry.py  ·  scripts/supervisor_runtime.py  ·  scripts/task_execution_memory.py</text></svg>