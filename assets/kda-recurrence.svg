<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.b{fill:#eaf3ff;stroke:#3b82f6;stroke-width:2}.g{fill:#edf9f0;stroke:#38a169;stroke-width:2}.o{fill:#fff4e8;stroke:#e58a2c;stroke-width:2}.r{fill:#fff0f0;stroke:#dc5a5a;stroke-width:2}.line{stroke:#394b63;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#394b63"/></marker></defs>
<text x="35" y="48" class="t">Kimi Delta Attention（KDA）：固定大小 recurrent memory 的“衰减 → 擦除 → 写入 → 读取”</text>
<text x="35" y="80" class="s">示意单个 attention head；t 表示 token 位置，S_t 是跨 token 递推的记忆矩阵</text>
<rect x="50" y="145" width="210" height="110" class="b" rx="10"/><text x="92" y="185" class="h">上一时刻记忆 S_(t-1)</text><text x="92" y="218" class="s">R^(d_k × d_v)</text>
<path d="M260 200 L350 200" class="line"/>
<rect x="355" y="130" width="210" height="140" class="g" rx="10"/><text x="420" y="170" class="h">① Forget</text><text x="385" y="205" class="s">α_t：按 key-channel 的</text><text x="385" y="233" class="s">细粒度 decay gate</text><text x="385" y="258" class="s">先衰减旧 memory</text>
<path d="M565 200 L655 200" class="line"/>
<rect x="660" y="130" width="220" height="140" class="r" rx="10"/><text x="730" y="170" class="h">② Delta Erase</text><text x="692" y="205" class="s">β_t 与 k_t 决定</text><text x="692" y="233" class="s">沿当前 key 方向擦除</text><text x="692" y="258" class="s">旧的冲突内容</text>
<path d="M880 200 L970 200" class="line"/>
<rect x="975" y="130" width="245" height="140" class="o" rx="10"/><text x="1050" y="170" class="h">③ Write</text><text x="1005" y="205" class="s">把当前 k_t ⊗ v_t</text><text x="1005" y="233" class="s">按 β_t 写入 memory</text><text x="1005" y="258" class="s">得到新的 S_t</text>
<path d="M1095 270 L1095 360" class="line"/>
<rect x="965" y="365" width="255" height="115" class="b" rx="10"/><text x="1050" y="405" class="h">S_t</text><text x="995" y="438" class="s">固定大小 R^(d_k × d_v)</text><text x="995" y="465" class="s">不随上下文长度增长</text>
<path d="M965 422 L815 422" class="line"/>
<rect x="585" y="365" width="225" height="115" class="g" rx="10"/><text x="655" y="405" class="h">④ Read</text><text x="615" y="438" class="s">当前 query q_t</text><text x="615" y="465" class="s">从 S_t 读取 → o_t</text>
<rect x="50" y="335" width="410" height="170" class="box" rx="10"/><text x="80" y="375" class="h">当前 token x_t 产生控制量</text><text x="80" y="410" class="s">q_t：读什么　k_t：写到哪个方向　v_t：写什么</text><text x="80" y="442" class="s">β_t：当前 key 的更新/擦除强度</text><text x="80" y="474" class="s">α_t：不同 key-channel 的长期遗忘速度</text>
<rect x="50" y="565" width="1170" height="135" class="box" rx="10"/><text x="80" y="605" class="h">为什么叫 Delta Attention？</text><text x="80" y="637" class="s">它不是简单做 S_t = decay·S_(t-1) + k_t v_t^T；写入前先沿 k_t 对应方向删除旧预测，再写入新 value，类似 delta-rule 的误差修正。</text><text x="80" y="670" class="s">优点：序列长度增加时 recurrent state 大小不变；代价：历史 token 被压缩进有限状态，精确内容寻址能力弱于 full attention，因此 Kimi K3 与 Gated MLA 混合使用。</text>
</svg>