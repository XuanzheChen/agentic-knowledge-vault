<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>
text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.box{fill:#f7f9fc;stroke:#62748a;stroke-width:2;rx:10}.blue{fill:#e8f2ff;stroke:#3b82f6;stroke-width:2}.green{fill:#eaf8ef;stroke:#39a96b;stroke-width:2}.orange{fill:#fff3e6;stroke:#e68a2e;stroke-width:2}.line{stroke:#394b63;stroke-width:2.5;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#394b63"/></marker></defs>
<text x="40" y="50" class="t">Hyper-Connections：一个子层中的数据流</text>
<text x="40" y="85" class="s">示意单个 token；n = 4 条 residual stream，每条 hidden size 为 d</text>
<rect x="55" y="145" width="160" height="300" class="box"/>
<text x="77" y="175" class="h">X<tspan baseline-shift="sub" font-size="70%">l</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="70%">4×d</tspan></text>
<rect x="80" y="200" width="110" height="48" class="blue"/><text x="111" y="230" class="s">R<tspan baseline-shift="sub" font-size="70%">1</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<rect x="80" y="255" width="110" height="48" class="green"/><text x="111" y="285" class="s">R<tspan baseline-shift="sub" font-size="70%">2</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<rect x="80" y="310" width="110" height="48" class="orange"/><text x="111" y="340" class="s">R<tspan baseline-shift="sub" font-size="70%">3</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<rect x="80" y="365" width="110" height="48" fill="#f1ebff" stroke="#8565c4" stroke-width="2"/><text x="111" y="395" class="s">R<tspan baseline-shift="sub" font-size="70%">4</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<path d="M215 250 L305 250" class="line"/><path d="M215 355 L305 355" class="line"/>
<rect x="310" y="190" width="165" height="105" class="blue"/><text x="338" y="225" class="h">H<tspan baseline-shift="sub" font-size="70%">res</tspan></text><text x="330" y="255" class="s">4×4，混合 stream</text><text x="330" y="278" class="s">feature 维 d 不变</text>
<rect x="310" y="330" width="165" height="105" class="green"/><text x="338" y="365" class="h">H<tspan baseline-shift="sub" font-size="70%">pre</tspan></text><text x="330" y="395" class="s">1×4，从 4 路读取</text><text x="330" y="418" class="s">输出 z ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<path d="M475 382 L550 382" class="line"/><rect x="555" y="330" width="150" height="105" class="orange"/><text x="600" y="365" class="h">F<tspan baseline-shift="sub" font-size="70%">l</tspan></text><text x="575" y="395" class="s">Attention / FFN</text><text x="585" y="418" class="s">ℝ<tspan baseline-shift="super" font-size="70%">d</tspan> → ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<path d="M705 382 L785 382" class="line"/><rect x="790" y="330" width="165" height="105" class="blue"/><text x="825" y="365" class="h">H<tspan baseline-shift="sub" font-size="70%">post</tspan></text><text x="812" y="395" class="s">4×1，写回 4 路</text><text x="812" y="418" class="s">输出 4×d</text>
<path d="M475 242 L1005 242 L1005 300" class="line"/><path d="M955 382 L1005 382 L1005 340" class="line"/>
<circle cx="1005" cy="320" r="25" fill="#fff" stroke="#394b63" stroke-width="2"/><text x="997" y="328" class="h">+</text>
<path d="M1030 320 L1090 320" class="line"/>
<rect x="1095" y="245" width="90" height="150" class="box"/><text x="1103" y="230" class="s">X<tspan baseline-shift="sub" font-size="70%">l+1</tspan></text><text x="1110" y="275" class="s">R′<tspan baseline-shift="sub" font-size="70%">1</tspan></text><text x="1110" y="310" class="s">R′<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="1110" y="345" class="s">R′<tspan baseline-shift="sub" font-size="70%">3</tspan></text><text x="1110" y="380" class="s">R′<tspan baseline-shift="sub" font-size="70%">4</tspan></text>
<rect x="55" y="520" width="1130" height="140" fill="#fbfcfe" stroke="#c8d1dc" stroke-width="1.5" rx="10"/>
<text x="80" y="555" class="h">关键：H<tspan baseline-shift="sub" font-size="70%">pre</tspan> / H<tspan baseline-shift="sub" font-size="70%">res</tspan> / H<tspan baseline-shift="sub" font-size="70%">post</tspan> 都作用在 stream 轴，不是 hidden feature 轴。</text>
<text x="80" y="590" class="s">H<tspan baseline-shift="sub" font-size="70%">pre</tspan>：决定当前子层从哪些 residual stream 读取；H<tspan baseline-shift="sub" font-size="70%">res</tspan>：决定残差路径如何跨 stream 混合；H<tspan baseline-shift="sub" font-size="70%">post</tspan>：决定子层输出写回哪些 stream。</text>
<text x="80" y="625" class="s">初始单路 x ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan> 通常复制成 4 路；标准 HC 不需要额外的 d→d′ 投影矩阵来“制造”这 4 条流。</text>
</svg>