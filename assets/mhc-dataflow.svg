<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
<style>
text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px}.sub{font-size:11px}
.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.r{fill:#fff0f0;stroke:#dc5a5a;stroke-width:2}.g{fill:#edf9f0;stroke:#38a169;stroke-width:2}.b{fill:#eaf3ff;stroke:#3b82f6;stroke-width:2}
.line{stroke:#394b63;stroke-width:2.5;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#394b63"/></marker></defs>

<text x="42" y="50" class="t">mHC：把自由的 residual mixing 约束成稳定路由</text>
<text x="42" y="84" class="s">核心变化发生在 residual mixing；Read / Write 也采用有界门控</text>

<!-- ordinary HC -->
<text x="72" y="135" class="h">一般 HC</text>
<rect x="70" y="158" width="210" height="110" class="r" rx="10"/>
<text x="112" y="195" class="h">自由 mixing matrix</text>
<text x="130" y="224" class="s">H</text><text x="145" y="230" class="sub">res</text>
<text x="170" y="224" class="s">：任意 4 × 4</text>
<text x="104" y="250" class="s">可放大或衰减 residual signal</text>

<path d="M280 213 L380 213" class="line"/>
<rect x="385" y="158" width="255" height="110" class="r" rx="10"/>
<text x="430" y="195" class="h">深层连续组合</text>
<text x="423" y="225" class="s">多层 H</text><text x="476" y="231" class="sub">res</text><text x="501" y="225" class="s"> 连续相乘</text>
<text x="414" y="250" class="s">可能逐层放大 / 衰减整体尺度</text>

<path d="M640 213 L735 213" class="line"/>
<rect x="740" y="158" width="390" height="110" class="r" rx="10"/>
<text x="835" y="195" class="h">结果：稳定性风险</text>
<text x="790" y="225" class="s">identity-like propagation 被破坏</text>
<text x="792" y="250" class="s">大规模、深层训练时更难稳定 scale</text>

<!-- mHC -->
<text x="72" y="335" class="h">mHC</text>
<rect x="70" y="360" width="195" height="112" class="b" rx="10"/>
<text x="118" y="397" class="h">raw logits</text>
<text x="100" y="430" class="s">输入相关的 4 × 4 矩阵</text>

<path d="M265 416 L350 416" class="line"/>
<rect x="355" y="350" width="240" height="132" class="b" rx="10"/>
<text x="398" y="388" class="h">Sinkhorn-Knopp</text>
<text x="388" y="420" class="s">exp → 行归一化 → 列归一化</text>
<text x="430" y="449" class="s">重复若干次</text>

<path d="M595 416 L675 416" class="line"/>
<rect x="680" y="340" width="270" height="152" class="g" rx="10"/>
<text x="733" y="378" class="h">双随机 H</text><text x="820" y="384" class="sub">res</text>
<text x="720" y="412" class="s">元素非负</text>
<text x="720" y="440" class="s">每一行之和 = 1</text>
<text x="720" y="468" class="s">每一列之和 = 1</text>

<path d="M950 416 L1035 416" class="line"/>
<rect x="1040" y="350" width="150" height="132" class="g" rx="10"/>
<text x="1069" y="388" class="h">稳定传播</text>
<text x="1062" y="423" class="s">尺度受控</text>
<text x="1055" y="451" class="s">乘积仍双随机</text>

<!-- explanation -->
<rect x="70" y="548" width="1120" height="125" class="box" rx="10"/>
<text x="96" y="584" class="h">为什么这样做？</text>
<text x="96" y="617" class="s">HC 的表达力来自“多路 residual stream + 可学习连接”，但完全自由的 residual mixing 可能让深层信号尺度失控。</text>
<text x="96" y="647" class="s">mHC 保留多流交互能力，同时把 mixing 限制在 Birkhoff polytope 内，使信息更像“重新分配”而不是任意放大。</text>
</svg>