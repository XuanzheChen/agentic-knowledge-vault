<text x="62" y="988" font-size="19" font-weight="600" fill="#b16d36">实际实现边界</text>
<text x="62" y="1025" font-size="19" fill="#2d4b60"><tspan x="62" dy="0">SQL 与文件检查点不是一个天然事务；未知提交结果的工具动作不自动重放；暂停也不等于立即取消正在进行的 Provider 请求。</tspan></text>
