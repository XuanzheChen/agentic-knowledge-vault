view.md / result.md</text><text x="136" y="1641" class="z1">原子替换状态 + 事务日志</text><text x="136" y="1677" class="z1">生成 resume capsule / workflow_passed</text><rect height="209" width="648" x="804" y="1465" class="z17"/><rect height="157" width="7" x="824" y="1491" class="z18"/><text x="850" y="1507" class="z19">RETRY  ·  TASK-LOCAL</text><text x="850" y="1556" class="z4">QUALITY REWORK</text><text x="850" y="1605" class="z1">确有实现质量缺陷才重做（最多 3 次）</text><text x="850" y="1641" class="z1">previous_review → E；独立质量预算</text><text x="850" y="1677" class="z1">S1 经 MCP 重派发；S0 可由 S 整理</text><rect height="209" width="648" x="1518" y="1465" class="z17"/><rect height="157" width="7" x="1538" y="1491" class="z18"/><text x="1564" y="1507" class="z19">RETRY  ·  TASK-LOCAL</text><text x="1564" y="1556" class="z4">ABNORMAL RETRY</text><text x="1564" y="1605" class="z1">异常且结果未能验证时重做（最多 3 次）</text><text x="1564" y="1641" class="z1">与 quality_rework 预算分别计数</text><text x="1564" y="1677" class="z1">已独立验证 PASS 则不强制重发 E</text><rect fill="#FFF0F0" filter="url(#shadow)" height="209" rx="23" stroke="#F5C6CB" stroke-width="2" width="648" x="2232" y="1465"/><rect fill="#B84D58" height="157" rx="3.5" width="7" x="2252" y="1491"/><text fill="#B84D58" font-size="19" font-weight="700" x="2278" y="1507">ESCALATION  ·  USER / PLANNER</text><text x="2278" y="1556" class="z6">BLOCKED / PLANNER</text><text x="2278" y="1605" class="z1">耗尽重试预算 → 停止调度，等待用户</text><text x="2278" y="1641" class="z1">显式重置轮次 / S 接管（单 Task 或持续）</text><text x="2278" y="1677" class="z1">需要改 Contract → vN+1 / 显式激活</text><text fill="#B56A20" font-size="20" font-weight="700" text-anchor="middle" x="1128" y="1706">RETRY → 携带 review.md，经原生 MCP 重新派发</text><text fill="#B56A20" font-size="20" font-weight="700" text-anchor="middle" x="1842" y="1706">RETRY → 经原生 MCP 重新派发 / 恢复</text><line stroke="#DFE7EF" stroke-width="3" x1="90" x2="2880" y1="1749" y2="1749"/><text fill="#14856C" font-size="27" font-weight="800" x="90" y="1804">04</text><text x=