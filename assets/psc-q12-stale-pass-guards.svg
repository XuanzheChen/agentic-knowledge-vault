<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1600" viewBox="0 0 2300 1600"><defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}</style><marker id="ar" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#B4C3D8"/></marker></defs><rect width="2300" height="1600" fill="#F7F9FD"/><rect width="2300" height="12" fill="#4E74D7"/>
<text x="73" y="68" font-size="23" fill="#476BC5" font-weight="800" text-anchor="start">PSC · Q12 / STALE SUPERVISOR PASS</text>
<text x="73" y="138" font-size="48" fill="#192B43" font-weight="850" text-anchor="start">过期 Review 能提出 PASS，但不能绕过 Runtime 的状态校验</text>
<text x="73" y="190" font-size="25" fill="#526782" font-weight="500" text-anchor="start">场景：Supervisor 已基于 V1 审核 T-006；提交前 Planner 完成了 V2 激活</text>
<rect x="68" y="238" width="2162" height="170" rx="18" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="2"/>
<rect x="92" y="262" width="660" height="119" rx="17" fill="#EEF4FF" stroke="#BED4FB" stroke-width="2"/>
