<text x="116" y="342" font-size="20" fill="#526782" font-weight="500" text-anchor="start">认为 T-006 符合旧版 AC，准备提交 PASS</text>
<rect x="832" y="262" width="660" height="119" rx="17" fill="#F2ECFF" stroke="#DCCEF7" stroke-width="2"/>
<text x="856" y="304" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">Planner：V2 已被批准</text>
<text x="856" y="342" font-size="20" fill="#526782" font-weight="500" text-anchor="start">选择 invalidate_from_task: T-006</text>
<rect x="1572" y="262" width="631" height="119" rx="17" fill="#EAF7F1" stroke="#BFE2D1" stroke-width="2"/>
<text x="1596" y="304" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">竞态窗口：状态已变化</text>
<text x="1596" y="342" font-size="20" fill="#526782" font-weight="500" text-anchor="start">激活 V2 先于 PASS 提交完成</text>
<path d="M753 321 L820 321" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
<path d="M1492 321 L1560 321" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
