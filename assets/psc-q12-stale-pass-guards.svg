<text x="110" y="774" font-size="25" fill="#FFFFFF" font-weight="800" text-anchor="start">第二层 · 串行化状态操作</text>
<rect x="113" y="823" width="597" height="91" rx="17" fill="#FFFFFF" stroke="#C9DEF9" stroke-width="2"/>
<text x="137" y="865" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">Contract 激活</text>
<text x="137" y="903" font-size="20" fill="#526782" font-weight="500" text-anchor="start">先获取工作流执行锁</text>
<rect x="839" y="813" width="618" height="112" rx="17" fill="#DBE9FF" stroke="#8FB9E8" stroke-width="2"/>
<text x="863" y="855" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">executor-dispatch.lock</text>
<text x="863" y="893" font-size="20" fill="#526782" font-weight="500" text-anchor="start">同一工作流的互斥边界</text>
<text x="863" y="924" font-size="20" fill="#526782" font-weight="500" text-anchor="start">不能同时激活 Contract 与提交 PASS</text>
<rect x="1582" y="823" width="589" height="91" rx="17" fill="#FFFFFF" stroke="#C9DEF9" stroke-width="2"/>
<text x="1606" y="865" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">Supervisor 提交 PASS</text>
<text x="1606" y="903" font-size="20" fill="#526782" font-weight="500" text-anchor="start">随后获得执行锁</text>
<path d="M710 867 L827 867" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
