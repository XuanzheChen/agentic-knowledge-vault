<text x="110" y="495" font-size="25" fill="#FFFFFF" font-weight="800" text-anchor="start">第一层 · 激活即状态迁移</text>
<text x="108" y="555" font-size="29" fill="#192B43" font-weight="800" text-anchor="start">激活 Approved V2 并应用 workflow_policy</text>
<rect x="108" y="580" width="622" height="86" rx="17" fill="#FFFFFF" stroke="#D2C2EE" stroke-width="2"/>
<text x="132" y="622" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">T-001～T-005</text>
<text x="132" y="660" font-size="20" fill="#526782" font-weight="500" text-anchor="start">保留已完成边界</text>
<rect x="821" y="580" width="622" height="86" rx="17" fill="#FFFFFF" stroke="#D2C2EE" stroke-width="2"/>
<text x="845" y="622" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">T-006</text>
<text x="845" y="660" font-size="20" fill="#526782" font-weight="500" text-anchor="start">重新按 V2 验收</text>
<rect x="1535" y="580" width="642" height="86" rx="17" fill="#FFFFFF" stroke="#D2C2EE" stroke-width="2"/>
<text x="1559" y="622" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">workflow_state.json</text>
<text x="1559" y="660" font-size="20" fill="#526782" font-weight="500" text-anchor="start">contract_version = 2 · current_task = T-006</text>
<path d="M730 625 L808 625" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
<path d="M1445 625 L1522 625" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
