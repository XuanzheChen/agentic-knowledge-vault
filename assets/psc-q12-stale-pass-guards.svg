<rect x="92" y="997" width="500" height="47" rx="12" fill="#238262" stroke="#238262" stroke-width="2"/>
<text x="110" y="1029" font-size="25" fill="#FFFFFF" font-weight="800" text-anchor="start">第三层 · 提交时重新校验</text>
<rect x="110" y="1086" width="620" height="152" rx="17" fill="#FFFFFF" stroke="#C4DED1" stroke-width="2"/>
<text x="134" y="1128" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">Runtime 读取当前权威状态</text>
<text x="134" y="1166" font-size="20" fill="#526782" font-weight="500" text-anchor="start">检查 State SHA（若提供）</text>
<text x="134" y="1197" font-size="20" fill="#526782" font-weight="500" text-anchor="start">核验 Contract 版本与当前 Task</text>
<rect x="840" y="1086" width="610" height="152" rx="17" fill="#FFF1F0" stroke="#EBBDBF" stroke-width="2"/>
<text x="864" y="1128" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">过期状态 / V1 Contract</text>
<text x="864" y="1166" font-size="20" fill="#526782" font-weight="500" text-anchor="start">旧状态 SHA → workflow_state_conflict</text>
<text x="864" y="1197" font-size="20" fill="#526782" font-weight="500" text-anchor="start">旧版本 → Contract version mismatch</text>
<rect x="1559" y="1086" width="622" height="152" rx="17" fill="#E4F6E9" stroke="#A4D6B8" stroke-width="2"/>
<text x="1583" y="1128" font-size="26" fill="#192B43" font-weight="800" text-anchor="start">拒绝 T-006 的旧 PASS</text>
<text x="1583" y="1166" font-size="20" fill="#526782" font-weight="500" text-anchor="start">状态不推进到 T-007</text>
<text x="1583" y="1197" font-size="20" fill="#526782" font-weight="500" text-anchor="start">Supervisor 读取新 Snapshot，按 V2 复核</text>
<path d="M731 1164 L827 1164" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
<path d="M1452 1164 L1546 1164" fill="none" stroke="#B4C3D8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ar)"/>
<text x="105" y="1298" font-size="21" fill="#42765D" font-weight="650" text-anchor="start">注意：expected_state_sha256 是可选参数；传入 V1 Contract 时仍有版本不匹配检查。</text>
<rect x="68" y="1371" width="2162" height="164" rx="21" fill="#FFF4E6" stroke="#EACAA3" stroke-width="2"/>
<text x="99" y="1415" font-size="27" fill="#A66B26" font-weight="800" text-anchor="start">当前实现边界 · 不自动证明 Review 内容的来源版本</text>
<text x="99" y="1459" font-size="22" fill="#192B43" font-weight="600" text-anchor="start">如果 Supervisor 错把 V1 Review 包装成 V2 验收，提交 V2 Contract 且状态信息有效，Runtime 不一定能识别语义错配。</text>
<text x="99" y="1498" font-size="21" fill="#526782" font-weight="500" text-anchor="start">未来可将 Review、Contract SHA、Task SHA 与工作区快照绑定，阻断过期验收证据复用。</text>
</svg>